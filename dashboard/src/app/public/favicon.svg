<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MediaCase">
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#131726"/>
  <!-- Logotipo MediaCase: iniciales J·L·J (Jennifer, Leno, Jonathan) con el "play" y las esquinas
       de un encuadre de video. Degradado índigo → violeta; sin fondo, para claro y oscuro. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- esquinas del encuadre -->
  <g fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M8 20v-6a6 6 0 0 1 6-6h6"/>
    <path d="M44 8h6a6 6 0 0 1 6 6v6"/>
    <path d="M8 44v6a6 6 0 0 0 6 6h6"/>
    <path d="M56 44v6a6 6 0 0 1-6 6h-6"/>
  </g>
  <!-- J L J -->
  <g fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 21v18a5.5 5.5 0 0 1-11 0"/>
    <path d="M31 18v26h9"/>
    <path d="M53 21v18a5.5 5.5 0 0 1-11 0"/>
  </g>
  <!-- play -->
  <path d="M41 27.5v9l7.5-4.5z" fill="url(#g)"/>
</svg>
